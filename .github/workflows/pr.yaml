name: pull request checks
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# for security reasons the github actions are pinned to specific release versions
jobs:
  link_checker:
    name: Schema checker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout all files
        uses: actions/checkout@v6

      - name: Check index
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: ./index.schema.json
          files: ./index.json

      - name: Check threat models
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: ./threat-model.schema.json
          files: |
            ./threat-models/web-applications/*.json
            ./threat-models/infrastructure/*.json
            ./threat-models/ai-ml-systems/*.json
            ./threat-models/third-party-integrations/*.json
            ./threat-models/web/*.json
          all-errors: true

      - name: Check CycloneDX threat model example
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: ./cyclonedx/cyclonedx-threat-model-2.0-bundled.schema.json
          files: ./cyclonedx/husky-ai-threat-model-cyclonedx-2.0.json
          all-errors: true

      - name: Check lossless CycloneDX conversion
        run: python3 scripts/cyclonedx_convert.py check threat-models/*/*.json
